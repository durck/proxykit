name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: true
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./...

  cross-build:
    name: cross-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: true
      - name: linux/amd64
        run: GOOS=linux GOARCH=amd64 go build ./...
      - name: windows/amd64
        run: GOOS=windows GOARCH=amd64 go build ./...
      - name: darwin/amd64
        run: GOOS=darwin GOARCH=amd64 go build ./...

  kerberos-integration:
    name: kerberos integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: true
      - run: PROXYKIT_KRB5_REQUIRE_DOCKER=1 go test -tags integration ./transport -run TestConnect_Negotiate_FullDance -count=1 -v
